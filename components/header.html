<script>
(function () {
  function initTubelight () {
    var nav  = document.getElementById('siteNav');
    var tube = document.getElementById('tubeIndicator');
    if (!nav || !tube) return;

    var active = nav.querySelector('.nav-active:not(.pill-nav__link--drop)');
    if (!active) active = nav.querySelector('.pill-nav__link:not(.pill-nav__link--drop)');

    function moveTo (el) {
      if (!el) return;
      var navR = nav.getBoundingClientRect();
      var elR  = el.getBoundingClientRect();
      tube.style.transform = 'translateX(' + (elR.left - navR.left) + 'px)';
      tube.style.width     = elR.width + 'px';
    }

    if (active) {
      tube.style.transition = 'none';
      moveTo(active);
      requestAnimationFrame(function () {
        tube.style.opacity = '1';
        tube.style.transition = '';
      });
    } else {
      tube.style.opacity = '1';
    }

    nav.querySelectorAll('.pill-nav__link, .pill-nav__dropdown').forEach(function (item) {
      item.addEventListener('mouseenter', function () {
        var link = item.classList.contains('pill-nav__link') ? item
                  : item.querySelector('.pill-nav__link--drop');
        if (link) moveTo(link);
      });
    });

    nav.addEventListener('mouseleave', function () {
      var cur = nav.querySelector('.nav-active');
      if (cur) moveTo(cur);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initTubelight);
  } else {
    initTubelight();
  }
}());
</script>
